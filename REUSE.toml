version = 1

# Källkod (JavaScript, SCSS/CSS, HTML-layouter, Ruby-skript, Mermaid-källkod)
[[annotations]]
path = [
  "assets/js/**",
  "assets/css/**",
  "_layouts/**",
  "_mermaid/**",
  "Rakefile",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Digg - Agency for Digital Government"
SPDX-License-Identifier = "EUPL-1.2"

# Dokumentation, bilder och konfigurationsfiler
[[annotations]]
path = [
  "README.md",
  "DEVELOPMENT.md",
  "index.md",
  "pages/**",
  "assets/images/**",
  "config/**",
  "Gemfile*",
  "package*.json",
  "puppeteer.json",
  ".github/**",
  ".*.toml",
  ".*.yaml",
  ".*.yml",
  "_config.yml",
  "justfile",
  "CODEOWNERS",
  ".gitignore",
  ".mise.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Digg - Agency for Digital Government"
SPDX-License-Identifier = "CC0-1.0"
