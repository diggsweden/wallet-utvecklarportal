# lychee.toml
# Configuration for Lychee link checker
# Docs: https://lychee.cli.rs/configuration/

# Maximum number of retries per request
max_retries = 3

# Website timeout in seconds from connect to response finished
timeout = 20

# Accept these status codes as valid
accept = [200, 202]

# Exclude URLs from checking (regex)
exclude = [
  '^https?://(localhost|127\.0\.0\.1)(:\d+)?',
  '^mailto:'
]

# User agent string to avoid blocking by bot protection
user_agent = "Mozilla/5.0 (compatible; DiggWalletDocsLinkChecker/1.0)"

# Do not check code/verbatim blocks as they contain example URIs, namespaces, and mock endpoints
include_verbatim = false

# Remap GitHub Pages baseurl to local build output folder
remap = [
  "file://(.*)/_site/wallet-utvecklarportal/(.*) file://$1/_site/$2",
  "file://(.*)/_site/wallet-utvecklarportal$ file://$1/_site/index.html",
  "^https://github\\.com/eu-digital-identity-wallet/eudi-doc-standards-and-technical-specifications/blob/main/docs/technical-specifications/ts3-wallet-unit-attestation\\.md$ https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-standards-and-technical-specifications/main/docs/technical-specifications/ts3-wallet-unit-attestation.md",
  "^https://github\\.com/eu-digital-identity-wallet/eudi-doc-standards-and-technical-specifications/blob/5924eb77ab4495d4dc0a874e54ac3e5de1fbd5b1/docs/technical-specifications/ts3-wallet-unit-attestation\\.md$ https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-standards-and-technical-specifications/5924eb77ab4495d4dc0a874e54ac3e5de1fbd5b1/docs/technical-specifications/ts3-wallet-unit-attestation.md"
]
